name: Normalize JSON line endings

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  normalize-json-lf:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Convert all JSON files to LF
        shell: python
        run: |
          from pathlib import Path

          for path in Path(".").rglob("*.json"):
              if ".git" in path.parts:
                  continue

              data = path.read_bytes()
              new_data = data.replace(b"\r\n", b"\n").replace(b"\r", b"\n")

              if new_data != data:
                  path.write_bytes(new_data)
                  print(f"Normalized: {path}")

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: Normalize JSON line endings to LF
          branch: normalize-json-lf
          delete-branch: true
          title: Normalize JSON line endings to LF
          body: |
            Converts all `*.json` files in the repository from Windows CRLF to Unix LF.
          add-paths: |
            **/*.json
